name: Feature request
description: Suggest an improvement to Multi Gmail.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome, especially its account-selection and safety behavior.
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Operation type
      options:
        - Read-only
        - Reversible write
        - Send or destructive action
        - Setup or developer experience
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
