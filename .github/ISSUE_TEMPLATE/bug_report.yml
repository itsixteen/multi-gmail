name: Bug report
description: Report a reproducible problem without including email content or credentials.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Redact email addresses, message bodies, OAuth URLs, tokens, and client JSON.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run…
        2. Ask Codex…
        3. See…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Multi Gmail version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, Node.js version, Codex app or CLI
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional. Remove credentials, OAuth URLs, email addresses, subjects, and bodies.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed all credentials, tokens, OAuth URLs, and private email content.
          required: true
